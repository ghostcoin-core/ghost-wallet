[package]
name = "seal-release-key"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Makes the Seal's ML-DSA-65 release key on an offline machine, signs measurement lists with it, and checks a signed list against its public half."
publish = false

[lib]
name = "seal_release_key"
path = "src/lib.rs"

[[bin]]
name = "seal-release-key"
path = "src/main.rs"

# The Seal's own list reader and release key (`ghost_seal::measurements`, only
# built with the `nitro` feature), and for the signing key the audited crates
# `seal/Cargo.toml` pins, at the same exact versions and features. The `nitro`
# feature also brings the vsock crate into the tree; this tool never uses it.
# No networking of any kind.
[dependencies]
ghost-seal = { path = "../../seal", features = ["nitro"] }
getrandom = { version = "=0.4.3", default-features = false }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["zeroize"] }
zeroize = "=1.9.1"

# The lattice signatures are slow unoptimised; build the dependencies
# optimised in the tests too.
[profile.dev.package."*"]
opt-level = 3

# Keep this crate out of any parent workspace.
[workspace]
