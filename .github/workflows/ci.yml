# Runs the same checks as scripts/ci-gate.sh on every push to main and on
# pull requests. The iOS build needs a Mac and is checked by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs the pnpm version named in package.json's packageManager field.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: hashFiles('tsconfig.json') != ''
        run: pnpm exec tsc --noEmit

      - name: Lint
        if: hashFiles('eslint.config.*', '.eslintrc*') != ''
        run: pnpm exec eslint . --max-warnings 0

      - name: Unit tests
        run: pnpm exec jest --ci --passWithNoTests=false

  rust:
    name: rust
    needs: rust-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All Rust test shards passed
        run: |
          echo "shards: ${{ needs.rust-shard.result }}"
          test "${{ needs.rust-shard.result }}" = success

  # The Rust core tests take longer than one 10-minute job, mostly in the
  # header tests (each builds a 256 MiB RandomX cache, one at a time), so
  # they are split by test across parallel jobs.
  rust-shard:
    name: rust (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust core tests
        run: scripts/rust-test-shard.sh ${{ matrix.shard }} 4
