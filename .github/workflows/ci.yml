# Runs the same checks as scripts/ci-gate.sh on every push to main and on
# pull requests. The iOS build needs a Mac and is checked by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs the pnpm version named in package.json's packageManager field.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: hashFiles('tsconfig.json') != ''
        run: pnpm exec tsc --noEmit

      - name: Lint
        if: hashFiles('eslint.config.*', '.eslintrc*') != ''
        run: pnpm exec eslint . --max-warnings 0

      - name: Unit tests
        run: pnpm exec jest --ci --passWithNoTests=false

  # The Rust tests take about 9 minutes in one job, nearly all of it in four
  # long chain tests in header_budget. Those four run in two jobs of their own,
  # and "rest" runs every other test (skipping only those four by name), so a
  # new test file is always picked up and each job stays under the limit.
  rust:
    name: rust (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: chain-a
            args: --test header_budget -- reorgs_are_reported saved_progress_resumes
          - group: chain-b
            args: --test header_budget -- only_recent_headers_are_saved releasing_the_caches_drops
          - group: rest
            args: -- --skip reorgs_are_reported --skip saved_progress_resumes --skip only_recent_headers_are_saved --skip releasing_the_caches_drops
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust core tests
        run: cargo test --manifest-path core/Cargo.toml --locked ${{ matrix.args }}
