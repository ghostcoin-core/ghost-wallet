# Runs one native benchmark on the bench screen and waits for it to pass.
#
#   maestro test -e BENCH=summon -e TIMEOUT=600000 .maestro/bench.yaml
#
# BENCH names the benchmark and must be given. TIMEOUT is the wait for its
# result in milliseconds (10 minutes if not given). scripts/sim-test.sh runs
# the flow once per benchmark on a simulator, with 90 minutes for the node
# benchmarks.
appId: com.ghostcoin.wallet
---
- launchApp:
    stopApp: true
- openLink: ghostwallet://bench
# iOS asks before a link opens the app; the alert does not always show.
- extendedWaitUntil:
    visible: Open
    timeout: 5000
    optional: true
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Run
    timeout: 30000
- tapOn:
    id: bench-name-${BENCH}
- tapOn: Run
# The result's first line is "<name>: <status>"; proving can take minutes and
# a node benchmark syncs thousands of headers.
- extendedWaitUntil:
    visible:
      id: bench-result
      text: '${BENCH}: ok[\s\S]*'
    timeout: ${TIMEOUT || 600000}
