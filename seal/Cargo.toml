[package]
name = "ghost-seal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Seal: the logic that talks to Ghost Sealed NTAG 424 DNA cards and runs Fill, Check and Open."
publish = false

[lib]
name = "ghost_seal"

# Audited RustCrypto crates, each pinned to one exact version, and the
# wallet core. No elliptic-curve crate, no networking, no cloud SDK. Default
# features are off where a crate has any, so nothing optional comes in
# unasked.
[dependencies]
aes = { version = "=0.9.2", features = ["zeroize"] }
cbc = { version = "=0.2.1", default-features = false }
cmac = "=0.8.0"
getrandom = { version = "=0.4.3", default-features = false }
hkdf = "=0.13.0"
hmac = "=0.13.0"
ml-dsa = { version = "=0.1.1", default-features = false, features = ["zeroize"] }
ml-kem = { version = "=0.3.3", default-features = false }
rand_core = "=0.10.1"
sha3 = { version = "=0.12.0", default-features = false }
zeroize = "=1.9.1"
# The wallet core: the chain check reuses its coin-tree check, its coin leaf
# code and its settlement depth instead of copying them. It brings Ghost's
# client and proofs at the commit the core pins.
ghost-wallet-core = { path = "../core" }

# Only with the `nitro` feature (the enclave program, its parent proxy and
# their tests): checking AWS's Nitro attestation signature (ECDSA P-384,
# verify only; nothing outside the tests signs), the SHA-256 of the pinned
# AWS root, and vsock sockets. The default build has none of these.
libc = { version = "=0.2.191", optional = true }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa"], optional = true }
sha2 = { version = "=0.11.1", default-features = false, optional = true }
vsock = { version = "=0.5.5", optional = true }
# Also only with `nitro`: TLS ended inside the enclave (rustls, TLS 1.3 only,
# the `ring` provider alone, no TLS 1.2 code), the enclave's fresh
# self-signed ECDSA P-256 certificate made at each start (rcgen, `ring`
# backend only), HTTP/1.1 request heads (httparse) and JSON (serde_json,
# above). No elliptic-curve code is written here; these crates do it.
httparse = { version = "=1.10.1", default-features = false, optional = true }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"], optional = true }

# Only with the `test-server` feature (the development test Seal server, its
# binary and its tests): an HTTP server with rustls for HTTPS, and JSON for
# the relay's requests and answers (also used by `nitro`). The default build
# has neither. Both `nitro` and `test-server` also ask the chain nodes over
# JSON-RPC (`node_rpc`): HTTP/1.1 with httparse, TLS 1.3 with rustls.
serde_json = { version = "=1.0.154", optional = true }
tiny_http = { version = "=0.12.0", default-features = false, features = ["ssl-rustls"], optional = true }

[features]
default = []
# The Nitro Enclaves build: the published measurements, attestation, the M
# handover between enclaves, the phones' attestation, the parent proxy, and
# the relay served to phones over TLS ended inside the enclave.
nitro = [
    "dep:httparse",
    "dep:libc",
    "dep:p384",
    "dep:rcgen",
    "dep:rustls",
    "dep:serde_json",
    "dep:sha2",
    "dep:vsock",
]
# The development test Seal server: the relay protocol over HTTP(S), the test
# M only, with the card registry file and the chain check over real nodes.
# Never for real money.
test-server = ["dep:httparse", "dep:rustls", "dep:serde_json", "dep:tiny_http"]

[[bin]]
name = "seal_enclave"
path = "src/bin/seal_enclave.rs"
required-features = ["nitro"]

[[bin]]
name = "seal_proxy"
path = "src/bin/seal_proxy.rs"
required-features = ["nitro"]

[[bin]]
name = "test_seal_server"
path = "src/bin/test_seal_server.rs"
required-features = ["test-server"]

[[test]]
name = "relay_server"
path = "tests/relay_server.rs"
required-features = ["test-server"]

[[test]]
name = "measurements"
path = "tests/measurements.rs"
required-features = ["nitro"]

[[test]]
name = "attestation"
path = "tests/attestation.rs"
required-features = ["nitro"]

[[test]]
name = "key_share"
path = "tests/key_share.rs"
required-features = ["nitro"]

[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = ["nitro"]

[[test]]
name = "relay_http"
path = "tests/relay_http.rs"
required-features = ["nitro"]

[[test]]
name = "enclave_tls"
path = "tests/enclave_tls.rs"
required-features = ["nitro"]

[[test]]
name = "enclave_serve"
path = "tests/enclave_serve.rs"
required-features = ["nitro"]

[[test]]
name = "node_rpc"
path = "tests/node_rpc.rs"
required-features = ["nitro"]

[[test]]
name = "registry_load"
path = "tests/registry_load.rs"
required-features = ["nitro"]

[[test]]
name = "journal_log"
path = "tests/journal_log.rs"

[[test]]
name = "host_journal"
path = "tests/host_journal.rs"
required-features = ["nitro"]

# The lattice signatures and key encapsulation are slow unoptimised; build the
# dependencies optimised in the tests too, without debug info, so that linking
# the test programs side by side stays small.
[profile.dev.package."*"]
opt-level = 3
debug = false

# The enclave program's release build is reproducible: one codegen unit, no
# incremental state, no debug info, symbols stripped, and (set by the build
# scripts) a fixed target, `--remap-path-prefix` and `SOURCE_DATE_EPOCH`.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
incremental = false
debug = false
strip = "symbols"
panic = "unwind"

# Keep this crate out of any parent workspace.
[workspace]
