[package]
name = "ghost-seal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Seal: the logic that talks to Ghost Sealed NTAG 424 DNA cards and runs Fill, Check and Open."
publish = false

[lib]
name = "ghost_seal"

# Audited RustCrypto crates, each pinned to one exact version, and the
# wallet core. No elliptic-curve crate, no networking, no cloud SDK. Default
# features are off where a crate has any, so nothing optional comes in
# unasked.
[dependencies]
aes = { version = "=0.9.2", features = ["zeroize"] }
cbc = { version = "=0.2.1", default-features = false }
cmac = "=0.8.0"
getrandom = { version = "=0.4.3", default-features = false }
hkdf = "=0.13.0"
hmac = "=0.13.0"
ml-dsa = { version = "=0.1.1", default-features = false, features = ["zeroize"] }
ml-kem = { version = "=0.3.3", default-features = false }
rand_core = "=0.10.1"
sha3 = { version = "=0.12.0", default-features = false }
zeroize = "=1.9.1"
# The wallet core: the chain check reuses its coin-tree check, its coin leaf
# code and its settlement depth instead of copying them. It brings Ghost's
# client and proofs at the commit the core pins.
ghost-wallet-core = { path = "../core" }

# Only with the `nitro` feature (the enclave program, its parent proxy and
# their tests): checking AWS's Nitro attestation signature (ECDSA P-384,
# verify only; nothing outside the tests signs), the SHA-256 of the pinned
# AWS root, and vsock sockets. The default build has none of these.
libc = { version = "=0.2.191", optional = true }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa"], optional = true }
sha2 = { version = "=0.11.1", default-features = false, optional = true }
vsock = { version = "=0.5.5", optional = true }

[features]
default = []
# The Nitro Enclaves build: the published measurements, attestation, the M
# handover between enclaves, the phones' attestation and the parent proxy.
nitro = ["dep:libc", "dep:p384", "dep:sha2", "dep:vsock"]

[[bin]]
name = "seal_enclave"
path = "src/bin/seal_enclave.rs"
required-features = ["nitro"]

[[bin]]
name = "seal_proxy"
path = "src/bin/seal_proxy.rs"
required-features = ["nitro"]

[[test]]
name = "measurements"
path = "tests/measurements.rs"
required-features = ["nitro"]

[[test]]
name = "attestation"
path = "tests/attestation.rs"
required-features = ["nitro"]

[[test]]
name = "key_share"
path = "tests/key_share.rs"
required-features = ["nitro"]

[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = ["nitro"]

# The lattice signatures and key encapsulation are slow unoptimised; build the
# dependencies optimised in the tests too.
[profile.dev.package."*"]
opt-level = 3

# The enclave program's release build is reproducible: one codegen unit, no
# incremental state, no debug info, symbols stripped, and (set by the build
# scripts) a fixed target, `--remap-path-prefix` and `SOURCE_DATE_EPOCH`.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
incremental = false
debug = false
strip = "symbols"
panic = "unwind"

# Keep this crate out of any parent workspace.
[workspace]
