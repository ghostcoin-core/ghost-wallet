<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>6. Send · Ghost Wallet mockup</title>
    <link rel="icon" href="../../brand/favicon/favicon.svg" />
    <link rel="stylesheet" href="mockups.css" />
  </head>
  <body>
    <div class="page">
      <main class="screen" aria-label="Send">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2" /><path d="M22 11v2" /></svg>
        </div>

        <div class="top-bar">
          <a class="icon-button" href="home.html" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          </a>
          <span style="flex: 1"></span>
          <span class="badge">
            <svg class="icon small" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" /></svg>
            Test network
          </span>
          <span class="logo"><img src="../../brand/svg/ghost-logo-primary.svg" alt="Ghost" /></span>
        </div>

        <form class="content" action="payment.html">
          <h2>Send GHOST</h2>

          <div class="field">
            <label for="recipient">To</label>
            <input id="recipient" class="mono" type="text" autocomplete="off" spellcheck="false" value="0xe5fbe4d8256744ec6fd55f2ce5bdfae7cbf355fd" />
          </div>

          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" class="mono" type="text" inputmode="decimal" value="25.00" style="font-size: 22px" />
            <span class="quiet">You have <span class="mono">1,284.50</span> GHOST</span>
          </div>

          <ul class="rows panel" aria-label="Summary">
            <li class="row">
              <span class="grow">Fee</span>
              <span class="amount">0.002 GHOST</span>
            </li>
            <li class="row">
              <span class="grow">Arrives</span>
              <span class="value">In under a minute</span>
            </li>
            <li class="row">
              <span class="grow">Total</span>
              <span class="amount">25.002 GHOST</span>
            </li>
          </ul>

          <span style="flex: 1"></span>
          <button class="button" type="submit" style="margin-bottom: 24px">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9 16c1.7 1.3 4.3 1.3 6 0" /></svg>
            Send with Face ID
          </button>
        </form>
      </main>

      <nav class="flow-nav" aria-label="Mockup screens">
        <a href="home.html">Back: 5. Home</a>
        <a href="index.html">All screens</a>
        <a href="payment.html">Next: 7. Payment</a>
      </nav>
    </div>
  </body>
</html>
