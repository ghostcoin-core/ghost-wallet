<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>8. Receive · Ghost Wallet mockup</title>
    <link rel="icon" href="../../brand/favicon/favicon.svg" />
    <link rel="stylesheet" href="mockups.css" />
  </head>
  <body>
    <div class="page">
      <main class="screen" aria-label="Receive">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2" /><path d="M22 11v2" /></svg>
        </div>

        <div class="top-bar">
          <a class="icon-button" href="home.html" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          </a>
          <span style="flex: 1"></span>
          <span class="badge">
            <svg class="icon small" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" /></svg>
            Test network
          </span>
          <span class="logo"><img src="../../brand/svg/ghost-logo-primary.svg" alt="Ghost" /></span>
        </div>

        <div class="content" style="align-items: center; text-align: center">
          <h2>Receive GHOST</h2>
          <p>Share this address. Only send GHOST on the test network to it.</p>

          <div
            role="img"
            aria-label="QR code of the address, placeholder"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 240px; height: 240px; margin-top: 8px; border: 2px dashed #E4E3EC; border-radius: 20px; background: #F5F5F8; color: #6E6C82"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 48px; height: 48px; stroke-width: 1.25"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14h3v3M21 14v7h-4M14 21v-3" /></svg>
            <span style="font-size: 14px">QR code</span>
          </div>

          <div class="panel" style="width: 100%; padding: 16px">
            <p class="quiet">Your address</p>
            <p class="address" style="margin-top: 6px; color: #0E0D1A">0xe5fbe4d8256744ec6fd55f2ce5bdfae7cbf355fd</p>
          </div>

          <span style="flex: 1"></span>
          <div class="button-row" style="width: 100%; margin-bottom: 24px">
            <button class="button" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a1 1 0 0 1 1-1h9" /></svg>
              Copy
            </button>
            <button class="button secondary" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" /></svg>
              Share
            </button>
          </div>
        </div>
      </main>

      <nav class="flow-nav" aria-label="Mockup screens">
        <a href="payment.html">Back: 7. Payment</a>
        <a href="index.html">All screens</a>
        <a href="lock.html">Next: 9. Lock</a>
